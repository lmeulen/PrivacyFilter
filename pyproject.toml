[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "privacyfilter"
dynamic = ["version"]
description = "Dutch free-text privacy filter for PII-like data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Leo van der Meulen" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "nl-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl",
  "pyopenssl>=25.0,<27",
  "pyyaml>=6.0.2,<7",
  "spacy>=3.8,<3.9",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
updater = [
  "beautifulsoup4>=4.13,<5",
  "cbsodata>=1.3.5,<2",
  "geopandas>=1.0,<2",
  "lxml>=5.3,<7",
  "numpy>=2.0,<3",
  "osmnx>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]
dev = [
  "httpx2>=2.0,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.version]
path = "src/privacyfilter/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/privacyfilter"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
lint.select = ["E", "F", "I", "B"]
lint.ignore = ["E501"]

[tool.ruff.format]
exclude = [
  "src/privacyfilter/api.py",
  "src/privacyfilter/certificates.py",
  "src/privacyfilter/csv_filter.py",
  "src/privacyfilter/examples.py",
  "src/privacyfilter/pii.py",
  "src/privacyfilter/processor.py",
  "src/privacyfilter/updater.py",
  "test/test_DataUpdater.py",
  "test/test_Examples.py",
  "test/test_FilterCSVColumn.py",
  "test/test_PrivacyFilter.py",
  "test/test_PrivacyFilterAPI.py",
  "test/test_PrivacyFilter_NLP.py",
  "test/test_ReleaseVersion.py",
]
