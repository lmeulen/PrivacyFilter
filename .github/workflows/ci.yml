name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --extra dev --extra updater --locked
      - name: Check dependencies
        run: uv run python -m pip check
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: uv run pip-audit --progress-spinner off
      - name: Verify canonical dataset layout
        run: >-
          uv run python -c "from pathlib import Path; assert not Path('datasets').exists();
          assert Path('src/privacyfilter/data/firstnames.csv').is_file();
          assert Path('src/privacyfilter/data/lastnames.csv').is_file()"
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting for maintained modules
        run: >-
          uv run ruff format --check src/privacyfilter/configuration.py
          src/privacyfilter/rules.py src/privacyfilter/nlp.py src/privacyfilter/core.py
          test/test_Components.py
      - name: Run tests
        run: uv run pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify lock file
        run: uv lock --check
