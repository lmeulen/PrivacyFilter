name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify release tag matches source version
        run: >-
          uv run --no-sync python scripts/verify_release_version.py "${GITHUB_REF_NAME}"
          --version-file src/privacyfilter/_version.py
      - name: Install and verify locked release
        run: |
          uv sync --extra dev --extra updater --locked
          uv run python -m pip check
          uv run pip-audit --progress-spinner off
          uv run pytest -q
      - name: Build distribution
        run: uv build
      - name: Verify tag matches distribution version
        run: >-
          uv run python scripts/verify_release_version.py "${GITHUB_REF_NAME}" dist/*
          --version-file src/privacyfilter/_version.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
